name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package supports Node >= 18; the dev toolchain (vitest, tsup) needs a newer Node.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Run the offline example
        run: npm run example:loop

      - name: Run the preflight and feedback example
        run: npm run example:preflight

      - name: Run the windowed repeats and warnings example
        run: npm run example:warnings

      - name: Run the tool runner example
        run: npm run example:runner
